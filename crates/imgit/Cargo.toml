[package]
name = "imgit"
description = "ImGit Desktop: the application shell (window, Dear ImGui, fonts, renderer)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "imgit"
path = "src/main.rs"

[features]
default = ["lcd-text"]
# The app's own OpenGL renderer (nearest-sampled font atlas, per-channel coverage blending) and, on Windows, the
# DirectWrite ClearType font loader that feeds it. Without it the stock dear-imgui-glow renderer and stb_truetype
# draw the UI.
lcd-text = ["dep:windows"]

[dependencies]
imgit-app.workspace = true
imgit-git.workspace = true
imgit-platform.workspace = true
imgit-syntax.workspace = true
imgit-vt.workspace = true
anyhow = "1"
# Gravatar downloads (the system's TLS stack: no C toolchain needed for the crypto).
ureq = { version = "3", default-features = false, features = ["native-tls-no-default"] }
thiserror.workspace = true
dear-imgui-rs = { version = "0.22", features = ["system-clipboard"] }
dear-imgui-winit = "0.22"
dear-imgui-glow = "0.22"
winit = "0.30"
glutin = "0.32"
glutin-winit = "0.5"
glow = "0.18"
raw-window-handle = "0.6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# DirectWrite, for the ClearType font loader.
windows = { version = "0.62", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_DirectWrite",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21.2", default-features = false }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
