# Builds (Windows, Linux, macOS) and smoke-tests every push to the default branch and every pull request.
name: CI

on:
  push:
    branches: [github-main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build.yml

  # Memory checks on Linux: the unit tests and the app itself (headless, under Xvfb and Mesa's llvmpipe), once built
  # with AddressSanitizer + LeakSanitizer + UBSan and once under Valgrind memcheck. An invalid access, a read of
  # uninitialised memory, undefined behaviour or a definite / indirect leak fails the run (tools/memcheck/).
  memcheck:
    name: Memory check (${{ matrix.tool }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - tool: asan
            preset: linux-asan
          - tool: valgrind
            preset: linux-valgrind
    env:
      VCPKG_DISABLE_METRICS: 1
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # a real history for the graph and File History views

      # the same compiler as build.yml, so the vcpkg ports' ABI hashes match its binary cache
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build g++-14 pkg-config \
            libxinerama-dev libxcursor-dev xorg-dev libglu1-mesa-dev \
            xvfb xauth libgl1-mesa-dri valgrind
          printf 'CC=gcc-14\nCXX=g++-14\n' >> "$GITHUB_ENV"

      - name: Check out vcpkg
        run: |
          {
            echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg"
            echo "VCPKG_CACHE_DIR=$RUNNER_TEMP/vcpkg-cache"
            echo "VCPKG_BINARY_SOURCES=clear;files,$RUNNER_TEMP/vcpkg-cache,readwrite"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/vcpkg-cache"
          baseline=$(grep -o '"builtin-baseline": *"[0-9a-f]*"' vcpkg.json | grep -o '[0-9a-f]\{40\}')
          git clone --quiet --filter=blob:none https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout --quiet "$baseline"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics

      # Falls back on build.yml's x64-linux cache for the app's ports; saves its own entry when it built GoogleTest.
      # (The sanitizers instrument ImGit only, so both tools share the same ports.)
      - name: Restore the vcpkg binary cache
        id: vcpkg-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_CACHE_DIR }}
          key: vcpkg-x64-linux-tests-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlays/**', 'vcpkg-triplets/**') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-x64-linux-tests-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlays/**', 'vcpkg-triplets/**') }}-
            vcpkg-x64-linux-tests-
            vcpkg-x64-linux-

      - name: Count cached ports
        id: cached-before
        run: echo "count=$(find "$VCPKG_CACHE_DIR" -type f | wc -l)" >> "$GITHUB_OUTPUT"

      - name: Configure (installs the vcpkg dependencies)
        run: cmake --preset ${{ matrix.preset }}

      - name: Check for newly built ports
        id: cached-after
        run: echo "count=$(find "$VCPKG_CACHE_DIR" -type f | wc -l)" >> "$GITHUB_OUTPUT"

      - name: Save the vcpkg binary cache
        if: matrix.tool == 'asan' && steps.cached-after.outputs.count != steps.cached-before.outputs.count
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_CACHE_DIR }}
          key: ${{ steps.vcpkg-restore.outputs.cache-primary-key }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Unit tests
        run: ctest --preset ${{ matrix.preset }}

      - name: The app, headless
        run: tools/memcheck/run_app.sh ${{ matrix.tool }} build/${{ matrix.preset }}/imgit .
