# Builds ImGit for Windows, Linux and macOS and uploads one package per platform as a workflow artifact.
# Called by ci.yml (every push / pull request) and release.yml (attaches the packages to a release).
name: Build

on:
  workflow_call:
    inputs:
      ref:
        description: The commit, branch or tag to build (the caller's ref when empty)
        type: string
        default: ''
      version:
        description: The version in the package names, such as v0.2.0 (the short sha when empty)
        type: string
        default: ''
      upx:
        description: Compress the Windows and Linux executables with UPX (macOS has no working UPX target)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2025
            preset: ci-windows
            triplet: x64-windows-static
            platform: windows-x64
          - name: Linux x64
            os: ubuntu-24.04
            preset: ci-linux
            triplet: x64-linux
            platform: linux-x64
          - name: macOS arm64
            os: macos-15
            preset: ci-macos
            triplet: arm64-osx
            platform: macos-arm64
    env:
      VCPKG_DISABLE_METRICS: 1

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # GLFW's X11 headers (README.md), the compiler, and Xvfb + Mesa for the smoke test
          sudo apt-get install -y --no-install-recommends \
            ninja-build g++-14 pkg-config \
            libxinerama-dev libxcursor-dev xorg-dev libglu1-mesa-dev \
            xvfb xauth libgl1-mesa-dri
          printf 'CC=gcc-14\nCXX=g++-14\n' >> "$GITHUB_ENV"

      # Ninja for the presets; pkg-config and the autotools for the vcpkg ports that configure with them
      - name: Install macOS packages
        if: runner.os == 'macOS'
        run: brew install ninja pkg-config autoconf automake libtool

      # cl, link, the Windows SDK and Ninja on PATH for clang-cl (and for vcpkg's own port builds)
      - name: Set up the MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # vcpkg at the manifest's builtin-baseline, so CI resolves the same port versions as a local build.
      - name: Check out vcpkg
        shell: bash
        run: |
          temp="${RUNNER_TEMP//\\//}"
          {
            echo "VCPKG_ROOT=$temp/vcpkg"
            echo "VCPKG_CACHE_DIR=$temp/vcpkg-cache"
            echo "VCPKG_BINARY_SOURCES=clear;files,$temp/vcpkg-cache,readwrite"
          } >> "$GITHUB_ENV"
          mkdir -p "$temp/vcpkg-cache"
          baseline=$(grep -o '"builtin-baseline": *"[0-9a-f]*"' vcpkg.json | grep -o '[0-9a-f]\{40\}')
          git clone --quiet --filter=blob:none https://github.com/microsoft/vcpkg "$temp/vcpkg"
          git -C "$temp/vcpkg" checkout --quiet "$baseline"

      - name: Bootstrap vcpkg (Linux, macOS)
        if: runner.os != 'Windows'
        run: '"$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics'

      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "$env:VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics'

      # vcpkg's binary cache: built ports as zips, keyed by their ABI hash (port version, options, compiler).
      # A new cache entry is saved only when this run built a port the restored cache did not have.
      - name: Restore the vcpkg binary cache
        id: vcpkg-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_CACHE_DIR }}
          key: vcpkg-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlays/**', 'vcpkg-triplets/**') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlays/**', 'vcpkg-triplets/**') }}-
            vcpkg-${{ matrix.triplet }}-

      - name: Count cached ports
        id: cached-before
        shell: bash
        run: echo "count=$(find "$VCPKG_CACHE_DIR" -type f | wc -l)" >> "$GITHUB_OUTPUT"

      # pwsh on every runner: Git Bash on Windows would put its own `link` ahead of MSVC's.
      - name: Configure (installs the vcpkg dependencies)
        shell: pwsh
        run: cmake --preset ${{ matrix.preset }}

      - name: Check for newly built ports
        id: cached-after
        shell: bash
        run: echo "count=$(find "$VCPKG_CACHE_DIR" -type f | wc -l)" >> "$GITHUB_OUTPUT"

      - name: Save the vcpkg binary cache
        if: steps.cached-after.outputs.count != steps.cached-before.outputs.count
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_CACHE_DIR }}
          key: ${{ steps.vcpkg-restore.outputs.cache-primary-key }}

      - name: Build
        shell: pwsh
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Upload vcpkg logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-logs-${{ matrix.platform }}
          path: |
            ${{ env.VCPKG_ROOT }}/buildtrees/*/*.log
            build/vcpkg_installed*/vcpkg/issue_body.md
          if-no-files-found: ignore

      # The Linux runner has no GPU, so the window renders through Mesa's llvmpipe on Xvfb.
      # (The Windows runner has no OpenGL 3.3 driver, so there is no smoke test there.)
      - name: Smoke test (screenshot of this repository)
        if: runner.os == 'Linux'
        run: |
          timeout 120 xvfb-run --auto-servernum --server-args="-screen 0 1440x900x24" \
            build/${{ matrix.preset }}/imgit . --screenshot smoke.bmp
          test -s smoke.bmp

      # The macOS runner has a window server and a software GL; whether the virtual GPU gives a 3.3 core context
      # is not guaranteed, so a failure here is reported but does not fail the build.
      - name: Smoke test on macOS (screenshot of this repository)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          perl -e 'alarm shift; exec @ARGV' 120 \
            build/${{ matrix.preset }}/ImGit.app/Contents/MacOS/ImGit . --screenshot smoke.bmp
          test -s smoke.bmp

      - name: Upload the smoke test screenshot
        if: runner.os != 'Windows' && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshot-${{ matrix.platform }}
          path: smoke.bmp
          if-no-files-found: ignore

      # A pinned UPX release, checked against its SHA-256, so every release packs with the same compressor
      - name: Install UPX
        if: inputs.upx && runner.os != 'macOS'
        shell: bash
        env:
          UPX_VERSION: 5.0.2
        run: |
          temp="${RUNNER_TEMP//\\//}"
          if [ "$RUNNER_OS" = Windows ]; then
            asset="upx-$UPX_VERSION-win64.zip"
            sha256=1cff6d6ee01c404d4a1ae56003056bd4cfa28d0a5cea1d0950daaf872a4facc9
          else
            asset="upx-$UPX_VERSION-amd64_linux.tar.xz"
            sha256=ddc2654063fe4dc80d95b420788494e4db078ebb01a650692d623b5a9906e61e
          fi
          curl -sSLf -o "$temp/$asset" "https://github.com/upx/upx/releases/download/v$UPX_VERSION/$asset"
          echo "$sha256  $temp/$asset" | sha256sum -c -
          if [ "$RUNNER_OS" = Windows ]; then
            7z x -o"$temp" "$temp/$asset" > /dev/null
            echo "$temp/upx-$UPX_VERSION-win64" >> "$GITHUB_PATH"
          else
            tar -xJf "$temp/$asset" -C "$temp"
            echo "$temp/upx-$UPX_VERSION-amd64_linux" >> "$GITHUB_PATH"
          fi

      - name: Package
        id: package
        shell: bash
        run: |
          version="${{ inputs.version }}"
          version="${version:-$(git rev-parse --short HEAD)}"
          name="imgit-$version-${{ matrix.platform }}"
          mkdir -p "dist/$name/licenses"
          if [ "$RUNNER_OS" = Windows ]; then
            cp build/${{ matrix.preset }}/imgit.exe "dist/$name/"
            if [ "${{ inputs.upx }}" = true ]; then
              upx --best --lzma "dist/$name/imgit.exe"
              upx -t "dist/$name/imgit.exe"
            fi
          elif [ "$RUNNER_OS" = macOS ]; then
            cp -R build/${{ matrix.preset }}/ImGit.app "dist/$name/"
            strip -x "dist/$name/ImGit.app/Contents/MacOS/ImGit"
            # strip drops the linker's ad-hoc signature, without which Apple silicon refuses to run the binary
            codesign --force --deep --sign - "dist/$name/ImGit.app"
          else
            cp build/${{ matrix.preset }}/imgit "dist/$name/"
            # every symbol and all debug info (the statically linked vcpkg libraries' included), plus the compiler tags
            strip --strip-all --remove-section=.comment "dist/$name/imgit"
            if readelf -S --wide "dist/$name/imgit" | grep -E '\.(debug_|zdebug_|symtab|comment)'; then
              echo "::error::strip left debug or symbol sections in imgit"
              exit 1
            fi
            if [ "${{ inputs.upx }}" = true ]; then
              upx --best --lzma "dist/$name/imgit"
              upx -t "dist/$name/imgit"
              # the smoke test above ran the unpacked build, so run the packed one too before it ships
              timeout 120 xvfb-run --auto-servernum --server-args="-screen 0 1440x900x24" \
                "dist/$name/imgit" . --screenshot "$RUNNER_TEMP/smoke-upx.bmp"
              test -s "$RUNNER_TEMP/smoke-upx.bmp"
            fi
          fi
          cp README.md "dist/$name/"
          # assets/ is compiled in, so its notices ship next to the binary, with every statically linked library's
          cp assets/fonts/LICENSE.txt "dist/$name/licenses/OpenSans.txt"
          cp assets/icons/NOTICE.txt "dist/$name/licenses/FontAwesome.txt"
          cp assets/cursors/NOTICE.txt "dist/$name/licenses/Chromium-cursors.txt"
          for copyright in build/vcpkg_installed*/${{ matrix.triplet }}/share/*/copyright; do
            port=$(basename "$(dirname "$copyright")")
            case "$port" in vcpkg-*) continue ;; esac # vcpkg's build helpers, not linked in
            cp "$copyright" "dist/$name/licenses/$port.txt"
          done
          cd dist
          if [ "$RUNNER_OS" = Windows ]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
            echo "file=dist/$name.zip" >> "$GITHUB_OUTPUT"
          elif [ "$RUNNER_OS" = macOS ]; then
            # ditto keeps the bundle's structure and attributes the way Finder's Compress does
            ditto -c -k --keepParent "$name" "$name.zip"
            echo "file=dist/$name.zip" >> "$GITHUB_OUTPUT"
          else
            tar -czf "$name.tar.gz" "$name"
            echo "file=dist/$name.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: imgit-${{ matrix.platform }}
          path: ${{ steps.package.outputs.file }}
          if-no-files-found: error

  # The browser build: WebAssembly through emsdk, the libraries built from source (cmake/WebDependencies.cmake)
  web:
    name: Browser (WebAssembly)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build

      - name: Set up emsdk
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.12

      - name: Configure
        run: cmake --preset web-release

      - name: Build
        run: cmake --build --preset web-release

      # Headless Chromium renders WebGL 2 through SwiftShader; the page needs the COOP / COEP headers for its threads.
      - name: Smoke test (the page runs its first frames)
        run: |
          mkdir -p "$RUNNER_TEMP/smoke"
          (cd "$RUNNER_TEMP/smoke" && npm init -y > /dev/null && npm install --silent playwright@1.63.0 \
            && npx playwright install --with-deps chromium)
          python3 tools/serve_web.py build/web-release --port 8000 &
          sleep 2
          # next to its node_modules, where the script's `import 'playwright'` is resolved
          cp tools/web_smoke.mjs "$RUNNER_TEMP/smoke/"
          node "$RUNNER_TEMP/smoke/web_smoke.mjs" http://localhost:8000/imgit.html smoke-web.png

      - name: Upload the smoke test screenshot
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshot-web
          path: smoke-web.png
          if-no-files-found: ignore

      - name: Package
        id: package
        run: |
          version="${{ inputs.version }}"
          version="${version:-$(git rev-parse --short HEAD)}"
          name="imgit-$version-web"
          mkdir -p "dist/$name/licenses"
          cp build/web-release/imgit.html build/web-release/imgit.js build/web-release/imgit.wasm "dist/$name/"
          cp tools/serve_web.py README.md docs/WEB.md "dist/$name/"
          cp assets/fonts/LICENSE.txt "dist/$name/licenses/OpenSans.txt"
          cp assets/icons/NOTICE.txt "dist/$name/licenses/FontAwesome.txt"
          cp assets/cursors/NOTICE.txt "dist/$name/licenses/Chromium-cursors.txt"
          cp res/web/fonts/LICENSE.txt "dist/$name/licenses/DejaVu.txt"
          deps=build/web-release/_deps
          cp "$deps/imgui-src/LICENSE.txt" "dist/$name/licenses/imgui.txt"
          cp "$deps/freetype-src/LICENSE.TXT" "dist/$name/licenses/freetype.txt"
          cp "$deps/libgit2-src/COPYING" "dist/$name/licenses/libgit2.txt"
          cp "$deps/stb-src/LICENSE" "dist/$name/licenses/stb.txt"
          glfw_license=$(find "$EMSDK" -ipath '*emscripten-glfw*' -name 'LICENSE*' -print -quit)
          if [ -n "$glfw_license" ]; then cp "$glfw_license" "dist/$name/licenses/emscripten-glfw.txt"; fi
          cd dist
          zip -qr "$name.zip" "$name"
          echo "file=dist/$name.zip" >> "$GITHUB_OUTPUT"

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: imgit-web
          path: ${{ steps.package.outputs.file }}
          if-no-files-found: error
