# Builds ImGit for Windows, Linux and macOS and uploads one package per platform as a workflow artifact.
# Called by ci.yml (every push / pull request) and release.yml (attaches the packages to a release).
name: Build

on:
  workflow_call:
    inputs:
      ref:
        description: The commit, branch or tag to build (the caller's ref when empty)
        type: string
        default: ''
      version:
        description: The version in the package names, such as v0.2.0 (the short sha when empty)
        type: string
        default: ''
      upx:
        description: Compress the Windows and Linux executables with UPX (macOS has no working UPX target)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2025
            platform: windows-x64
          - name: Linux x64
            os: ubuntu-24.04
            platform: linux-x64
          - name: macOS arm64
            os: macos-26
            platform: macos-arm64
    env:
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # the C / C++ compiler for the bundled libgit2 and Dear ImGui, OpenSSL for HTTPS, and Xvfb, Mesa and the
          # X11 keyboard library for the smoke test
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            xvfb xauth libgl1-mesa-dri libxkbcommon-x11-0

      # The release, components and profile named in rust-toolchain.toml.
      - name: Install the Rust toolchain
        run: rustup toolchain install

      # The registry and the build directory, keyed by the lock file.
      - name: Restore the Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ matrix.platform }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ matrix.platform }}-${{ hashFiles('rust-toolchain.toml') }}-

      - name: Lint
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked --no-fail-fast

      - name: Build
        run: cargo build --release --locked -p imgit

      # The Linux runner has no GPU, so the window renders through Mesa's llvmpipe on Xvfb.
      # (The Windows runner has no OpenGL 3.3 driver, so there is no smoke test there.)
      - name: Smoke test (screenshot of this repository)
        if: runner.os == 'Linux'
        run: |
          timeout 120 xvfb-run --auto-servernum --server-args="-screen 0 1440x900x24" \
            target/release/imgit . --screenshot smoke.bmp
          test -s smoke.bmp

      - name: Upload the smoke test screenshot
        if: runner.os == 'Linux' && !cancelled()
        uses: actions/upload-artifact@v6
        with:
          name: smoke-screenshot-${{ matrix.platform }}
          path: smoke.bmp
          if-no-files-found: ignore

      # A pinned UPX release, checked against its SHA-256, so every release packs with the same compressor
      - name: Install UPX
        if: inputs.upx && runner.os != 'macOS'
        shell: bash
        env:
          UPX_VERSION: 5.0.2
        run: |
          temp="${RUNNER_TEMP//\\//}"
          if [ "$RUNNER_OS" = Windows ]; then
            asset="upx-$UPX_VERSION-win64.zip"
            sha256=1cff6d6ee01c404d4a1ae56003056bd4cfa28d0a5cea1d0950daaf872a4facc9
          else
            asset="upx-$UPX_VERSION-amd64_linux.tar.xz"
            sha256=ddc2654063fe4dc80d95b420788494e4db078ebb01a650692d623b5a9906e61e
          fi
          # GitHub's release downloads fail now and then (5xx): retry before failing the job.
          curl -sSLf --retry 5 --retry-all-errors --retry-delay 10 -o "$temp/$asset" \
            "https://github.com/upx/upx/releases/download/v$UPX_VERSION/$asset"
          echo "$sha256  $temp/$asset" | sha256sum -c -
          if [ "$RUNNER_OS" = Windows ]; then
            7z x -o"$temp" "$temp/$asset" > /dev/null
            echo "$temp/upx-$UPX_VERSION-win64" >> "$GITHUB_PATH"
          else
            tar -xJf "$temp/$asset" -C "$temp"
            echo "$temp/upx-$UPX_VERSION-amd64_linux" >> "$GITHUB_PATH"
          fi

      - name: Package
        id: package
        shell: bash
        run: |
          version="${{ inputs.version }}"
          version="${version:-$(git rev-parse --short HEAD)}"
          name="imgit-$version-${{ matrix.platform }}"
          mkdir -p "dist/$name/licenses"
          if [ "$RUNNER_OS" = Windows ]; then
            cp target/release/imgit.exe "dist/$name/"
            if [ "${{ inputs.upx }}" = true ]; then
              upx --best --lzma "dist/$name/imgit.exe"
              upx -t "dist/$name/imgit.exe"
            fi
          elif [ "$RUNNER_OS" = macOS ]; then
            cp target/release/imgit "dist/$name/"
            strip -x "dist/$name/imgit"
            # strip drops the linker's ad-hoc signature, without which Apple silicon refuses to run the binary
            codesign --force --sign - "dist/$name/imgit"
          else
            cp target/release/imgit "dist/$name/"
            strip --strip-all --remove-section=.comment "dist/$name/imgit"
            if [ "${{ inputs.upx }}" = true ]; then
              upx --best --lzma "dist/$name/imgit"
              upx -t "dist/$name/imgit"
              # the smoke test above ran the unpacked build, so run the packed one too before it ships
              timeout 120 xvfb-run --auto-servernum --server-args="-screen 0 1440x900x24" \
                "dist/$name/imgit" . --screenshot "$RUNNER_TEMP/smoke-upx.bmp"
              test -s "$RUNNER_TEMP/smoke-upx.bmp"
            fi
          fi
          cp README.md "dist/$name/"
          # assets/ is compiled in, so its notices ship next to the binary
          cp assets/fonts/LICENSE.txt "dist/$name/licenses/OpenSans.txt"
          cp assets/icons/NOTICE.txt "dist/$name/licenses/FontAwesome.txt"
          cp assets/cursors/NOTICE.txt "dist/$name/licenses/Chromium-cursors.txt"
          cd dist
          if [ "$RUNNER_OS" = Windows ]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
            echo "file=dist/$name.zip" >> "$GITHUB_OUTPUT"
          elif [ "$RUNNER_OS" = macOS ]; then
            ditto -c -k --keepParent "$name" "$name.zip"
            echo "file=dist/$name.zip" >> "$GITHUB_OUTPUT"
          else
            tar -czf "$name.tar.gz" "$name"
            echo "file=dist/$name.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the package
        uses: actions/upload-artifact@v6
        with:
          name: imgit-${{ matrix.platform }}
          path: ${{ steps.package.outputs.file }}
          if-no-files-found: error
