# Publishing a GitHub release builds ImGit for Windows and Linux and attaches the packages and their
# SHA256SUMS.txt to the release. Run it by hand (Actions → Release → Run workflow) to rebuild the
# packages of an existing release; files with the same names are replaced.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to build and attach the packages to
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.event.release.tag_name || inputs.tag }}
      version: ${{ github.event.release.tag_name || inputs.tag }}

  publish:
    name: Attach to the release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: imgit-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum imgit-* | tee SHA256SUMS.txt

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" dist/* --clobber --repo "${{ github.repository }}"
