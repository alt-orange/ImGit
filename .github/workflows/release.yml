# Publishing a GitHub release builds ImGit for Windows, Linux and macOS. Each platform attaches its package
# and checksum as soon as it finishes; SHA256SUMS.txt is added after all builds finish, even if some fail.
# Run it by hand (Actions → Release → Run workflow) to rebuild an existing release; same-name files are replaced.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to build and attach the packages to
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.event.release.tag_name || inputs.tag }}
      version: ${{ github.event.release.tag_name || inputs.tag }}
      upx: true
      release_tag: ${{ github.event.release.tag_name || inputs.tag }}

  publish:
    name: Combined checksums
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: imgit-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum imgit-* | tee SHA256SUMS.txt

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" dist/SHA256SUMS.txt --clobber --repo "${{ github.repository }}"
