# ImGit Desktop, the Rust port. The C++ sources under src/ stay as the reference until the port reaches parity.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"

[workspace.dependencies]
imgit-syntax = { path = "crates/imgit-syntax" }
imgit-platform = { path = "crates/imgit-platform" }
imgit-git = { path = "crates/imgit-git" }
imgit-vt = { path = "crates/imgit-vt" }
imgit-app = { path = "crates/imgit-app" }

git2 = { version = "0.21", default-features = false }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bitflags = "2"
tempfile = "3"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The shipped build: fully optimised, with no debug info and no symbols.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
strip = "symbols"
# A panic ends the process at once (no unwinding code or tables in the executable). A panicking worker thread
# therefore takes the app down in a release build; debug builds and the tests still unwind.
panic = "abort"
